BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qnx-guest"
BBFILE_PATTERN_qnx-guest = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx-guest = "20"

# qnx     -- every QNX mechanism (toolchain, images, staging)
# qnx-hyp -- the shared application recipes. Several apps go into both the
#            hypervisor host and its guests (rpi-gpio, frame-router), so they
#            live in one place rather than being duplicated per image layer.
LAYERDEPENDS_qnx-guest = "core qnx qnx-hyp"
LAYERSERIES_COMPAT_qnx-guest = "scarthgap"
