BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qnx-guest"
BBFILE_PATTERN_qnx-guest = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx-guest = "20"

# qnx     -- every QNX mechanism (toolchain, images, staging)
# qnx-hyp -- the shared application recipes. Several apps go into both the
#            hypervisor host and its guests (rpi-gpio, frame-router), so they
#            live in one place rather than being duplicated per image layer.
LAYERDEPENDS_qnx-guest = "core qnx qnx-hyp"
LAYERSERIES_COMPAT_qnx-guest = "scarthgap"

# Shared .build fragments this layer offers to image templates.
QNX_TEMPLATE_INCLUDE_PATH += "${LAYERDIR}/files/ifs"

# qtbase-native builds Qt's host tools (moc/rcc/qmlcachegen) with the build
# host's own compiler and python before anything is cross-compiled for QNX, so
# those must be allowed through bitbake's sanitized PATH. NONFATAL: only the Qt
# recipes need them, and they fail with a clear "gcc not found" if the host
# lacks them -- no reason to break every other build. Like all HOSTTOOLS, this
# must be layer config, since the symlinks are made once at cooker startup.
HOSTTOOLS_NONFATAL += "gcc g++ python3"

# Qt bbappends apply only when meta-qt6 is in the build, so this layer keeps
# LAYERDEPENDS free of it and a build without meta-qt6 never parses them.
# Same mechanism meta-qnx uses for its own Qt bbappends.
BBFILES_DYNAMIC += " \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-*/*/*.bbappend \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-*/*/*.bb \
"
